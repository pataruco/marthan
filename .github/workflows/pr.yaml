name: UI checks
run-name: ${{ github.actor }} is linting and formatting
on:
  workflow_call:
  pull_request:
    branches:
      - 'main'
jobs:
  lint-format:
    name: Lint 🔎, Format ✅
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: latest
      - name: Run Biome
        run: biome ci .
